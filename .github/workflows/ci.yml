# C++ SDK CI — enforces the clang-tidy lint gate (cycle 114) + the build + cpp_self_test
# (the 6 frozen molecular-hash vectors + ML-KEM768). Born-enforced: the repo had no CI,
# so the gate was local-only/bypassable until now.
#
# clang-tidy is version-sensitive (the .clang-tidy bugprone-*/performance-* globs +
# WarningsAsErrors pick up whatever the installed clang-tidy defines). The gate was tuned
# against LLVM 22.1.4 locally, so CI pins LLVM 22 to reproduce that check set; the SDK is
# built with clang-22 too, so the compile_commands.json clang-tidy reads is clang-clean.
name: CI

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time. The publish workflow already
  # refuses a tag that disagrees with the manifest, but that only fires on a tag push, so
  # drift can sit in master until release day. Same script, no expected version: assert only
  # that the repo agrees with itself.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  gate:
    name: build + self-test + clang-tidy
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive fetches external/mlkem-native (the ML-KEM768 backend the
      # C++ build GLOBs + includes); without it CI fails with "'mlkem_native.h' not found".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsodium-dev libcurl4-openssl-dev \
            lsb-release wget software-properties-common gnupg

      # Pin LLVM 22 (matches the cycle-114 tuning, LLVM 22.1.4) so the clang-tidy check set
      # is reproducible — a different version could add/drop bugprone/performance checks.
      - name: Install LLVM 22 (clang + clang-tidy)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      # Build with clang-22 → the compile DB clang-tidy reads is clang-clean (no g++-only
      # flags). Default build type (no -march=native); EXPORT_COMPILE_COMMANDS is on by default.
      - name: Configure
        run: |
          CC=clang-22 CXX=clang++-22 cmake -S . -B build \
            -DKNISHIO_BUILD_TESTS=ON \
            -DKNISHIO_BUILD_EXAMPLES=OFF \
            -DCLANG_TIDY_EXE="$(command -v clang-tidy-22)"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Deterministic parity gate: the 6 frozen molecular hashes + ML-KEM768. Cross-SDK
      # validation is disabled (a single-repo checkout has no sibling SDK result dumps).
      - name: Self-test (frozen molecular hashes + ML-KEM768)
        run: |
          mkdir -p shared-test-results
          KNISHIO_DISABLE_CROSS_VALIDATION=true \
          KNISHIO_SHARED_RESULTS="$PWD/shared-test-results" \
            ./build/cpp_self_test

      # The cycle-114 lint gate (clang-tidy bugprone-*/performance-*, WarningsAsErrors).
      # Last so a clang-tidy version-drift failure is clearly isolated after build + self-test pass.
      - name: clang-tidy (lint gate)
        run: cmake --build build --target lint

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have. No submodules needed: this job only reads text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # If the CMake `project(... VERSION ...)` line changed relative to the base commit,
      # CHANGELOG.md must carry a matching `## [<version>]` heading. No change → no-op.
      # The line-anchored `VERSION` match picks up the project version and not
      # `cmake_minimum_required(VERSION ...)`, which is mid-line.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9A-Za-z.+-]*\).*/\1/p' "$1" | head -1; }
          git show "$BASE:CMakeLists.txt" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver CMakeLists.txt); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
