# C++ SDK publish — tag-driven GitHub Releases (cycle 182). Push a bare semver tag (e.g.
# `0.9.2`, no `v` prefix -- matches this repo's existing tag history: 0.1.37, 0.8.0, 0.9.0,
# 0.9.2) -> version-consistency gate -> build/self-test/lint gate (mirrors ci.yml) -> package
# prebuilt binaries -> GitHub Release.
#
# Distribution channel: GitHub Releases only. Unlike the other 6 SDKs (npm x2, Packagist,
# Maven Central, crates.io, PyPI), the C++ SDK has no matching package registry for this
# dependency set (libsodium/curl/openssl) -- a tagged GitHub Release with prebuilt tarballs
# *is* the publish target. Packaging mirrors the validator's proven pattern (servers/
# knishio-validator-rust/Makefile `package` targets): `cmake --install` to a staging tree
# (headers + shared/static libs + CMake package config, via the install() rules already in
# CMakeLists.txt), tarred per platform, with a SHAKE256SUMS manifest (FIPS 202 -- this
# project's default hash over SHA-2) computed over every shipped file. CPack is already
# wired in CMakeLists.txt (TGZ/DEB/RPM on Linux, ZIP/DragNDrop on macOS) but is intentionally
# NOT used here: it's only configured for this SDK (not the C SDK, which has no CPack at
# all), and its DEB/RPM generators need host tooling (dpkg-deb/rpmbuild) not uniformly
# present -- the plain install()+tar+SHAKE256SUMS path keeps both SDKs' release pipelines
# symmetric and is exactly what's already proven in this repo.
#
# No OIDC/trusted-publishing here -- there is no registry to authenticate to, so auth is just
# GITHUB_TOKEN with `contents: write` to create the Release. Deliberately no top-level
# `environment:` key (unlike the JS/Rust publish.yml, which target an OIDC trusted-publisher
# environment): a GitHub deployment environment configured "protected branches only" REJECTS
# tag-triggered deploys, and there is no registry-side trusted-publisher config here that would
# need one. If an environment is added later for its own sake, it must explicitly allow tag refs.
#
# Source distribution: GitHub already auto-attaches a source zip/tarball to every Release, so
# this workflow does not build a custom source archive. That auto-generated archive (like any
# plain `git archive` of a tag) does NOT include the external/mlkem-native submodule (~150MB of
# pinned upstream history) -- building from it still requires `git submodule update --init`,
# exactly as the README already documents via `git clone --recursive`. Nothing changes there.
name: Publish

on:
  push:
    tags:
      - '[0-9]*'
  # Dry run. This workflow is otherwise reachable only by pushing a tag, which publishes — so
  # every change to it would ship unexercised. A dispatch runs the gate and the full
  # build/self-test/package path and stops before the release, because the release job is
  # guarded on `github.event_name == 'push'`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to dry-run the gate against, e.g. 0.9.3. Releases NOTHING.'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release; no registry auth needed

jobs:
  version-gate:
    name: verify tag matches declared SDK version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # persist-credentials: false (2026-08) — nothing here pushes; the Release uses GITHUB_TOKEN, not git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # THREE independent places declare "what version is this SDK": CMakeLists.txt's
      # project(... VERSION ...), the SDK_VERSION literal in src/KnishIOClient.cpp (returned
      # by getVersion()), and the `version` literal in self-test-compatible.cpp — which is
      # what the cross-SDK gauntlet's snapshot coherence gate reads out of cpp-results.json.
      # This step previously checked only the first two, so drift in the third could ship.
      #
      # Logic lives in .github/scripts/check-version.sh so it also runs in CI on every push
      # and locally. A gate reachable only through a release is a gate that ships unproven.
      - name: Verify tag == every declared SDK version
        id: check
        # DISPATCH_TAG arrives via env, never interpolated into the shell text
        # (workflow-injection hygiene).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED="${GITHUB_REF#refs/tags/}"
          else
            EXPECTED="$DISPATCH_TAG"
          fi
          bash .github/scripts/check-version.sh "$EXPECTED"

  package:
    name: build + self-test + lint + package (${{ matrix.platform }})
    needs: version-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # fetch external/mlkem-native (vendored ML-KEM768)
          persist-credentials: false

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsodium-dev libcurl4-openssl-dev \
            lsb-release wget software-properties-common gnupg

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config libsodium openssl@3

      # LLVM 22 + clang-tidy on Linux only, matching ci.yml (no macOS lint job exists there
      # either) -- the .clang-tidy bugprone-*/performance-* set was tuned against LLVM 22.1.4.
      - name: Install LLVM 22 (clang + clang-tidy, Linux only)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      # KNISHIO_NATIVE_ARCH=OFF is load-bearing for a distributed artifact. The default
      # Release flags include -march=native -mtune=native, which target the BUILD host's
      # microarchitecture — a binary compiled on a GitHub runner would emit instructions
      # a user's older CPU may not implement, and SIGILL on first use. That would defeat
      # the entire point of shipping prebuilt binaries. Local and benchmark builds keep
      # the default (ON) and are unaffected.
      - name: Configure (Linux, clang-22)
        if: runner.os == 'Linux'
        run: |
          CC=clang-22 CXX=clang++-22 cmake -S . -B build \
            -DKNISHIO_NATIVE_ARCH=OFF \
            -DKNISHIO_BUILD_TESTS=ON \
            -DKNISHIO_BUILD_EXAMPLES=OFF \
            -DCLANG_TIDY_EXE="$(command -v clang-tidy-22)"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DKNISHIO_NATIVE_ARCH=OFF \
            -DKNISHIO_BUILD_TESTS=ON \
            -DKNISHIO_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build -j"$( (nproc || sysctl -n hw.ncpu) 2>/dev/null )"

      # Gate -- never release a tag that doesn't build/self-test/lint clean. Same build ci.yml
      # already proves; this job just extends it with install + package once it's green.
      - name: Self-test (frozen molecular hashes + ML-KEM768)
        run: |
          mkdir -p shared-test-results
          KNISHIO_DISABLE_CROSS_VALIDATION=true \
          KNISHIO_SHARED_RESULTS="$PWD/shared-test-results" \
            ./build/cpp_self_test

      # The unit tests the self-test does not cover: WotsSignatureParity (the cross-SDK
      # one-time-signature form), LegacyMlkem768Compat, EncryptedTransportFailClosed,
      # SecretStorage, MlkemEncapsEntropy, SHAKE256Validation. This job built them and never ran
      # them. CipherHashLive reports Skipped here (no validator; SKIP_RETURN_CODE 77).
      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: clang-tidy (lint gate, Linux only)
        if: runner.os == 'Linux'
        run: cmake --build build --target lint

      - name: Install to staging tree
        run: |
          set -euo pipefail
          STAGE_NAME="knishio-client-cpp-${{ needs.version-gate.outputs.version }}-${{ matrix.platform }}"
          echo "STAGE_NAME=$STAGE_NAME" >> "$GITHUB_ENV"
          cmake --install build --prefix "dist/$STAGE_NAME"
          cp LICENSE README.md "dist/$STAGE_NAME/"

      - name: Compute SHAKE256SUMS (FIPS 202, matches the validator Makefile pattern)
        run: |
          cd "dist/$STAGE_NAME"
          python3 <<'PY'
          import hashlib, os
          lines = []
          for root, _dirs, files in os.walk('.'):
              for f in sorted(files):
                  if f == 'SHAKE256SUMS':
                      continue
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, '.')
                  h = hashlib.shake_256(open(p, 'rb').read()).hexdigest(32)
                  lines.append(f'{h}  {rel}')
          lines.sort(key=lambda l: l.split('  ', 1)[1])
          open('SHAKE256SUMS', 'w').write('\n'.join(lines) + '\n')
          PY

      - name: Create tarball
        run: tar czf "dist/${STAGE_NAME}.tar.gz" -C dist "$STAGE_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: create GitHub Release
    needs: [version-gate, package]
    if: github.event_name == 'push'   # dispatch = dry run; never creates a Release
    runs-on: ubuntu-latest
    steps:
      # Checkout leads, before download-artifact: `actions/checkout` defaults to clean: true
      # (`git clean -ffdx && git reset --hard`), so running it second would delete the
      # downloaded dist/. It is here only so the CHANGELOG extraction below has a CHANGELOG.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Release body = this tag's CHANGELOG.md section, NOT generate_release_notes.
      # generate_release_notes builds "What's Changed" from merged PULL REQUESTS in the tag
      # range. Releases here land as direct pushes to master, so the only PR in 0.9.4..1.0.0
      # was a dependabot action-gh-release bump (#2) — and the 1.0.0 release page advertised
      # that CI bump while saying nothing about the work the release actually shipped. The
      # curated CHANGELOG entry is the source of truth; extract it and use it verbatim.
      #
      # This runs BEFORE the Release is created on purpose: the empty-section guard below is
      # only useful if it aborts ahead of it. Extraction needs nothing but the checkout.
      - name: Extract this tag's CHANGELOG section
        run: |
          set -euo pipefail
          # Derived from the tag itself, tolerating a leading `v`, so this needs no cross-job
          # output plumbing through the package matrix.
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          awk -v ver="## [$TAG_VERSION]" '
            index($0, ver) == 1 { inside = 1; print; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No '## [$TAG_VERSION]' section found — refusing to publish with empty release notes."
            exit 1
          fi
          echo "Release notes for $TAG_VERSION:"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          # `generate_release_notes` stays OFF, deliberately — do not restore it. The action
          # appends the WHOLE generated block (`<body>\n\n<notes>`), which would put the
          # "bump …(dependabot)" bullets back on the page; demoting reported-bad content is
          # not removing it. The only real loss is the "Full Changelog" compare link, and
          # synthesizing that needs the previous tag — i.e. fetch-depth: 0 on a publish job —
          # which is not worth a full-history clone for a cosmetic link.
          body_path: /tmp/release-notes.md
          files: dist/*.tar.gz
